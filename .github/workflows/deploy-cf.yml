name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, pre-release]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == (vars.CLOUDFLARE_DEPLOY_BRANCH || 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'ai-relay' }}
      CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || vars.CLOUDFLARE_DEPLOY_BRANCH || 'main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ Error: CLOUDFLARE_API_TOKEN is not set"
            echo "Please add it in Settings → Secrets and variables → Actions"
            echo "Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ Error: CLOUDFLARE_ACCOUNT_ID is not set"
            echo "Please add it in Settings → Secrets and variables → Actions"
            echo "Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          if [ -z "${{ secrets.RELAY_API_KEY }}" ]; then
            echo "❌ Error: RELAY_API_KEY is not set"
            echo "Please add it in Settings → Secrets and variables → Actions"
            echo "Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          echo "✅ All required secrets are configured"

      - name: Provision Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Provisioning talks to the Cloudflare REST API directly so every
          # call has an HTTP status and a structured JSON body we can enforce.
          # The previous version parsed wrangler's human-readable output and
          # swallowed create failures with `|| true`, which turned a token
          # permission error (D1 create → API error 10000) into a meaningless
          # "D1 database_id: <empty>" failure.
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          # cf <method> <path> [json-body] → sets CF_STATUS (HTTP code) and CF_BODY.
          # The token is only ever sent as a request header, never echoed.
          cf() {
            local args=(-sS -X "$1" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
                        -H "Content-Type: application/json"
                        -o /tmp/cf-response.json -w '%{http_code}')
            [ $# -ge 3 ] && args+=(-d "$3")
            CF_STATUS=$(curl "${args[@]}" "${BASE}${2}")
            CF_BODY=$(cat /tmp/cf-response.json)
          }

          cf_require_ok() { # cf_require_ok <what>
            if [ "${CF_STATUS}" -lt 200 ] || [ "${CF_STATUS}" -ge 300 ] \
               || [ "$(echo "${CF_BODY}" | jq -r '.success // false')" != "true" ]; then
              echo "❌ ${1} failed: HTTP ${CF_STATUS}"
              echo "${CF_BODY}" | jq . 2>/dev/null || echo "${CF_BODY}"
              exit 1
            fi
          }

          echo "=== Verifying API token ==="
          VERIFY_STATUS=$(curl -sS -X GET -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/cf-verify.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [ "${VERIFY_STATUS}" != "200" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN verification failed: HTTP ${VERIFY_STATUS}"
            jq -c '.errors' /tmp/cf-verify.json 2>/dev/null || true
            exit 1
          fi
          echo "✅ Token is active (status: $(jq -r '.result.status' /tmp/cf-verify.json))"

          # ─── D1 Database ───────────────────────────────────────────
          echo ""
          echo "=== Provisioning D1 database ==="
          cf GET "/d1/database"
          cf_require_ok "D1 list"
          DATABASE_ID=$(echo "${CF_BODY}" | jq -r '.result[]? | select(.name == "ai-relay") | .uuid' | head -1)

          if [ -n "${DATABASE_ID}" ]; then
            echo "✅ Reusing existing D1 database 'ai-relay'"
          else
            echo "D1 database 'ai-relay' not found, creating..."
            cf POST "/d1/database" '{"name": "ai-relay"}'
            if [ "${CF_STATUS}" -ge 200 ] && [ "${CF_STATUS}" -lt 300 ]; then
              DATABASE_ID=$(echo "${CF_BODY}" | jq -r '.result.uuid // empty')
              echo "✅ Created D1 database 'ai-relay'"
            else
              # Surface the real API error (missing D1 Edit permission, name
              # conflict, ...) instead of hiding it behind an empty id.
              echo "⚠️ D1 create returned HTTP ${CF_STATUS}:"
              echo "${CF_BODY}" | jq . 2>/dev/null || echo "${CF_BODY}"
              # Re-list once in case a concurrent run created it in the meantime.
              sleep 2
              cf GET "/d1/database"
              cf_require_ok "D1 re-list"
              DATABASE_ID=$(echo "${CF_BODY}" | jq -r '.result[]? | select(.name == "ai-relay") | .uuid' | head -1)
              if [ -n "${DATABASE_ID}" ]; then
                echo "✅ D1 database 'ai-relay' already exists (created concurrently)"
              fi
            fi
          fi

          echo ""
          echo "D1 database_id: ${DATABASE_ID:-<empty>}"

          if [ -z "${DATABASE_ID}" ] || [ "${DATABASE_ID}" = "null" ]; then
            echo "❌ Failed to obtain D1 database_id"
            exit 1
          fi

          echo "✅ Successfully obtained D1 database_id: ${DATABASE_ID}"

          # Inject database_id into wrangler.toml
          if grep -q "database_id" wrangler.toml; then
            sed -i "s|database_id = .*|database_id = \"${DATABASE_ID}\"|" wrangler.toml
          else
            sed -i "/database_name = \"ai-relay\"/a database_id = \"${DATABASE_ID}\"" wrangler.toml
          fi

          # ─── KV Namespace ──────────────────────────────────────────
          echo ""
          echo "=== Provisioning KV namespace ==="

          cf GET "/storage/kv/namespaces"
          cf_require_ok "KV list"
          # Priority order: prefer "ai-relay" (historical data), then wrangler-generated variants.
          KV_ID=$(echo "${CF_BODY}" | jq -r '.result[]? | select(.title == "ai-relay" or .title == "ai-relay-KV" or .title == "KV" or .title == "ai-relay-ai-relay") | .id' | head -1)

          if [ -n "${KV_ID}" ]; then
            echo "✅ Reusing existing KV namespace"
          else
            echo "KV namespace not found, creating 'ai-relay'..."
            cf POST "/storage/kv/namespaces" '{"title": "ai-relay"}'
            cf_require_ok "KV create"
            KV_ID=$(echo "${CF_BODY}" | jq -r '.result.id // empty')
            echo "✅ Created KV namespace 'ai-relay'"
          fi

          echo "KV namespace id: ${KV_ID}"

          if [ -z "${KV_ID}" ] || [ "${KV_ID}" = "null" ]; then
            echo "❌ Failed to obtain KV namespace id"
            exit 1
          fi

          # Inject KV id into wrangler.toml
          if grep -q "^id = " wrangler.toml; then
            sed -i "s|^id = .*|id = \"${KV_ID}\"|" wrangler.toml
          else
            sed -i "/binding = \"KV\"/a id = \"${KV_ID}\"" wrangler.toml
          fi

          # ─── Verify ────────────────────────────────────────────────
          echo ""
          echo "=== Final wrangler.toml ==="
          cat wrangler.toml

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Same structured-API discipline as the provisioning step: look the
          # project up first, create only when missing, and fail loudly on any
          # error other than "already exists" (no `|| true` swallowing).
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"

          code=$(curl -sS -X GET -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/cf-pages.json -w '%{http_code}' \
            "${BASE}/pages/projects/${CLOUDFLARE_PAGES_PROJECT_NAME}")

          if [ "${code}" = "200" ]; then
            echo "✅ Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}' already exists"
            exit 0
          fi
          if [ "${code}" != "404" ]; then
            echo "❌ Pages project lookup failed: HTTP ${code}"
            cat /tmp/cf-pages.json
            exit 1
          fi

          echo "Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}' not found, creating..."
          code=$(curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${CLOUDFLARE_PAGES_PROJECT_NAME}\", \"production_branch\": \"${CLOUDFLARE_PAGES_PRODUCTION_BRANCH}\"}" \
            -o /tmp/cf-pages.json -w '%{http_code}' \
            "${BASE}/pages/projects")

          if [ "${code}" -ge 200 ] && [ "${code}" -lt 300 ]; then
            echo "✅ Created Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}'"
          elif grep -qi "already exists" /tmp/cf-pages.json; then
            echo "✅ Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}' already exists (created concurrently)"
          else
            echo "❌ Pages project create failed: HTTP ${code}"
            cat /tmp/cf-pages.json
            exit 1
          fi

      - name: Build for Cloudflare Pages
        run: pnpm exec opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
        env:
          NODE_ENV: production

      - name: Adapt Build Output for Cloudflare Pages
        run: |
          # Copy static assets to the root of .open-next so they can be served directly by Pages
          if [ -d ".open-next/assets" ]; then
            cp -r .open-next/assets/* .open-next/
          fi

          # Materialize statically prerendered app routes so Pages can serve them
          # without passing `/` and `/admin` through the worker.
          CACHE_DIR="$(find .open-next/cache -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -z "$CACHE_DIR" ]; then
            echo "❌ No OpenNext cache directory found"
            exit 1
          fi

          CACHE_DIR="$CACHE_DIR" node -e '
            const fs = require("fs");
            const path = require("path");

            const cacheDir = process.env.CACHE_DIR;
            const outputRoot = ".open-next";
            const entries = [
              ["index.cache", "index.html"],
              ["admin.cache", path.join("admin", "index.html")],
              ["_not-found.cache", "404.html"]
            ];

            for (const [source, target] of entries) {
              const input = path.join(cacheDir, source);
              if (!fs.existsSync(input)) continue;
              const payload = JSON.parse(fs.readFileSync(input, "utf8"));
              if (!payload || !payload.html) continue;
              const output = path.join(outputRoot, target);
              fs.mkdirSync(path.dirname(output), { recursive: true });
              fs.writeFileSync(output, payload.html);
            }
          '

          # Rename worker.js to _worker.js to enable Pages Functions
          if [ -f ".open-next/worker.js" ]; then
            mv .open-next/worker.js .open-next/_worker.js
          fi
          # Tell Cloudflare Pages to serve the prerendered pages directly from CDN.
          echo '{"version":1,"include":["/*"],"exclude":["/","/admin","/_next/static/*","/favicon.ico","/*.png","/*.ico","/*.txt","/*.svg"]}' > .open-next/_routes.json

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}"
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"
          pnpm exec wrangler d1 migrations apply ai-relay --remote

      - name: Configure environment variables
        # Must run BEFORE the deploy step: Cloudflare Pages only binds
        # secrets/vars to the NEXT deployment, never retroactively to the
        # one being published. If secrets are pushed after `pages deploy`,
        # the freshly published deployment starts with an empty process.env
        # (no RELAY_ADMIN_KEY / RELAY_API_KEY), so admin auth returns 401
        # until a second deploy picks them up. Pushing them first ensures the
        # deployment below is published with the secrets already bound.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_RELAY_API_KEY: ${{ secrets.RELAY_API_KEY || vars.RELAY_API_KEY }}
          SYNC_RELAY_ADMIN_KEY: ${{ secrets.RELAY_ADMIN_KEY || vars.RELAY_ADMIN_KEY }}
          SYNC_RELAY_SIGNING_SECRET: ${{ secrets.RELAY_SIGNING_SECRET || vars.RELAY_SIGNING_SECRET }}
          SYNC_CRON_SECRET: ${{ secrets.CRON_SECRET || vars.CRON_SECRET }}
          SYNC_OPENAI_KEYS: ${{ secrets.OPENAI_KEYS || vars.OPENAI_KEYS }}
          SYNC_CLAUDE_KEYS: ${{ secrets.CLAUDE_KEYS || vars.CLAUDE_KEYS }}
          SYNC_DEEPSEEK_KEYS: ${{ secrets.DEEPSEEK_KEYS || vars.DEEPSEEK_KEYS }}
          SYNC_XIAOMI_KEYS: ${{ secrets.XIAOMI_KEYS || vars.XIAOMI_KEYS }}
          SYNC_XIAOMI_CODING_KEYS: ${{ secrets.XIAOMI_CODING_KEYS || vars.XIAOMI_CODING_KEYS }}
          SYNC_XIAOMIMIMO_SGP_CODING_KEYS: ${{ secrets.XIAOMIMIMO_SGP_CODING_KEYS || vars.XIAOMIMIMO_SGP_CODING_KEYS }}
          SYNC_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          SYNC_CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL || vars.CLAUDE_BASE_URL }}
          SYNC_DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || vars.DEEPSEEK_BASE_URL }}
          SYNC_XIAOMI_BASE_URL: ${{ secrets.XIAOMI_BASE_URL || vars.XIAOMI_BASE_URL }}
          SYNC_XIAOMI_CODING_BASE_URL: ${{ secrets.XIAOMI_CODING_BASE_URL || vars.XIAOMI_CODING_BASE_URL }}
          SYNC_XIAOMIMIMO_SGP_CODING_BASE_URL: ${{ secrets.XIAOMIMIMO_SGP_CODING_BASE_URL || vars.XIAOMIMIMO_SGP_CODING_BASE_URL }}
          SYNC_RELAY_DAILY_LIMIT: ${{ secrets.RELAY_DAILY_LIMIT || vars.RELAY_DAILY_LIMIT }}
          SYNC_RELAY_MONTHLY_LIMIT: ${{ secrets.RELAY_MONTHLY_LIMIT || vars.RELAY_MONTHLY_LIMIT }}
          SYNC_RELAY_MAX_CONCURRENT: ${{ secrets.RELAY_MAX_CONCURRENT || vars.RELAY_MAX_CONCURRENT }}
          SYNC_RELAY_MAX_QUEUE: ${{ secrets.RELAY_MAX_QUEUE || vars.RELAY_MAX_QUEUE }}
          SYNC_RELAY_KEY_POOL_VERSION_CHECK_TTL_MS: ${{ secrets.RELAY_KEY_POOL_VERSION_CHECK_TTL_MS || vars.RELAY_KEY_POOL_VERSION_CHECK_TTL_MS }}
          SYNC_RELAY_KV_KEY_USAGE_MODE: ${{ secrets.RELAY_KV_KEY_USAGE_MODE || vars.RELAY_KV_KEY_USAGE_MODE }}
          SYNC_RELAY_KV_USAGE_SAMPLE_RATE: ${{ secrets.RELAY_KV_USAGE_SAMPLE_RATE || vars.RELAY_KV_USAGE_SAMPLE_RATE }}
          SYNC_RELAY_KV_KEY_USAGE_SAMPLE_RATE: ${{ secrets.RELAY_KV_KEY_USAGE_SAMPLE_RATE || vars.RELAY_KV_KEY_USAGE_SAMPLE_RATE }}
          SYNC_RELAY_KV_ERROR_DETAIL_SAMPLE_RATE: ${{ secrets.RELAY_KV_ERROR_DETAIL_SAMPLE_RATE || vars.RELAY_KV_ERROR_DETAIL_SAMPLE_RATE }}
          SYNC_ENABLE_REQUEST_LOGS: ${{ secrets.ENABLE_REQUEST_LOGS || vars.ENABLE_REQUEST_LOGS }}
          SYNC_REQUEST_LOGS_MAX_ENTRIES: ${{ secrets.REQUEST_LOGS_MAX_ENTRIES || vars.REQUEST_LOGS_MAX_ENTRIES }}
          SYNC_CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || vars.CORS_ORIGINS }}
          SYNC_DEPLOY_URL: ${{ secrets.DEPLOY_URL || vars.DEPLOY_URL }}
        run: |
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}"
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"

          # Cloudflare Pages keeps production and preview env vars fully
          # separate, and `wrangler pages secret put` defaults to the
          # production environment. But `pages deploy --branch=<branch>`
          # publishes to *preview* whenever the branch is not the project's
          # production branch (e.g. a workflow_dispatch run from a feature or
          # pre-release branch). If we only wrote production secrets, that
          # preview deployment would start with an empty process.env and
          # admin/relay auth would return "Invalid API key". Pick the target
          # environment to match the branch we are about to deploy so the
          # secret lands where the deployment can actually read it.
          if [ "${GITHUB_REF_NAME}" = "${CLOUDFLARE_PAGES_PRODUCTION_BRANCH}" ]; then
            PAGES_ENV="production"
          else
            PAGES_ENV="preview"
          fi
          echo "Target Pages environment: ${PAGES_ENV} (branch=${GITHUB_REF_NAME}, production branch=${CLOUDFLARE_PAGES_PRODUCTION_BRANCH})"

          # 动态遍历环境变量中所有以 SYNC_ 开头的变量并推送到 CF Pages
          for var_name in $(env | grep -oE '^SYNC_[A-Z0-9_]+' | sort -u); do
            # 提取原变量名
            target_name="${var_name#SYNC_}"
            # 获取变量的值
            val="${!var_name}"

            if [ -n "$val" ]; then
              echo "Syncing $target_name to ${PAGES_ENV}..."
              echo "$val" | pnpm exec wrangler pages secret put "$target_name" --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --env "$PAGES_ENV"
            fi
          done

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}"
          export CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID}"
          pnpm exec wrangler pages deploy .open-next --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="${GITHUB_REF_NAME}"
